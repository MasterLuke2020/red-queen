name: Red Queen 1.1.0 isolated HA boot (synthetic)

on:
  push:
    branches:
      - feature/1.1.0-smart-living
  pull_request:
    paths:
      - "custom_components/wnhf/**"
      - "tools/rq11_ci_ha_smoke.sh"
      - ".github/workflows/ha-1-1-isolated-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify script shell syntax
        run: bash -n tools/rq11_ci_ha_smoke.sh
      - name: Start real HA 2026.9.2 without network, with synthetic empty registry
        run: bash tools/rq11_ci_ha_smoke.sh
