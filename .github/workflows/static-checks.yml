name: Static repository checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier compares HEAD with its parent for whitespace hygiene.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify Red Queen repository
        run: python tools/verify_repository.py
