name: Feature request
description: Propose a compatible Red Queen capability or domain improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the home-level problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: semantic_model
    attributes:
      label: Suggested semantic behavior
      description: Explain the desired objects, state, context, capability or execution semantics.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Execution / safety considerations
      description: If the feature can mutate hardware, describe feedback, idempotency and user-control implications.
  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      options:
        - State / sensing only
        - Diagnostic / read-only
        - Canonical execution
        - Context / rules / policies / decisions
        - Documentation
        - Unsure
    validations:
      required: true
