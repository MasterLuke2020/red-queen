# Optional für 1.2: manual_pause_entity_id: input_boolean.red_queen_automatik_pause
# Ist dieser Helfer ON oder nicht verfügbar, bleiben automatische EIN-Befehle gesperrt.
# Red Queen 1.2 – Muster für die tatsächlich vorhandenen Außenlichter
# Read-only-Registry-Inventur vom 09.11.2026. NUR BEISPIEL, NICHT produktiv!
#
# Die Red-Queen-Leuchten sind SPS-/PLC-Schaltlichter: nur state on/off.
# Keine RGB-, Dimm- oder Impuls-Parameter eintragen!
# Das Beispiel ist bewusst deaktiviert und schaltet nichts automatisch.
# Ausschließlich drei Kreise: Garage Außen Up/Down, Straße Up/Down, Hof Up/Down.
# Vorplatz Wand, Hof Wand, Garage innen, Terrasse u. a. sind ausgeschlossen.
# Am 09.11.2026 vom Betreiber bestätigt: Die Straße Up/Down ist
# light.hof_vorplatz_red_queen_strasse_up_down.
# light.wnhf_strasse_up_down ist 'unavailable' und bleibt ausgeschlossen.
# Garage Außen und Hof Up/Down vor Aktivierung ebenfalls physisch prüfen.
#
# Wenn bereits eine 'scenes:'-Liste besteht: Szene in die Liste aufnehmen,
# NICHT eine zweite 'scenes:'-Wurzel anlegen.
# Im fertigen Red-Queen-1.2-Konfigurator können die Leuchten ausgewählt
# werden; YAML-Dateien müssen dann nicht mehr bearbeitet werden.

scenes:
  - id: aussen_grundbeleuchtung
    name: "Außenbeleuchtung – Grundlicht"
    lights:
      light.wnhf_garage_aussen_up_down:
        state: "on"
      light.hof_vorplatz_red_queen_strasse_up_down:
        state: "on"
      light.wnhf_hof_up_down:
        state: "on"

automations:
  - id: aussen_abend_ein
    name: "Außenbeleuchtung bei Sonnenuntergang"
    enabled: false
    scene_id: aussen_grundbeleuchtung
    action: "on"
    trigger:
      type: sun
      event: sunset
      offset_minutes: 0
    allowed_modes: ["home", "away", "vacation"]
    allow_quiet: true

  - id: aussen_nacht_aus
    name: "Außenbeleuchtung um 23 Uhr AUS"
    enabled: false
    scene_id: aussen_grundbeleuchtung
    action: "off"
    trigger:
      type: time
      at: "23:00"
    reconcile_missed_off: false  # nach Staging-Abnahme explizit einschalten
