# Paste as ONE automation into Home Assistant UI > Edit in YAML.
# SAFE DEFAULT: disabled until physical validation of all 3 circuits.
alias: "Red Queen – Außenbeleuchtung 23 Uhr AUS"
description: >-
  Nur die drei Außenlichtkreise ausschalten, nie ganze Bereiche.
  Nach HA-Neustart versäumtes Nacht-AUS nur während der Nacht nachholen.
initial_state: false
triggers:
  - trigger: time
    at: "23:00:00"
    id: scheduled_off
    enabled: false
  - trigger: homeassistant
    event: start
    id: restart_after_missed_off
    enabled: false
conditions:
  - condition: template
    value_template: >-
      {{ trigger.id == 'scheduled_off'
         or (trigger.id == 'restart_after_missed_off'
             and (now().hour >= 23 or now().hour < 12)
             and is_state('sun.sun', 'below_horizon')) }}
actions:
  - action: light.turn_off
    target:
      entity_id:
        - light.wnhf_garage_aussen_up_down
        # Straße Up/Down vom Betreiber bestätigt (09.11.2026).
        # light.wnhf_strasse_up_down ist unavailable und ausgeschlossen.
        - light.hof_vorplatz_red_queen_strasse_up_down
        - light.wnhf_hof_up_down
mode: single
