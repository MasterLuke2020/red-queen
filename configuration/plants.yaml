schema_version: "1.0"

# Installation-owned Plant Care registry for the Weidnerhome reference system.
# Copy to /config/wnhf/house/registry/plants.yaml. Red Queen never invents an
# initial watering timestamp; every plant remains "unknown" until its first
# plants.record_watering event is recorded.
plants:
  - id: plant.eg.office.dragon_tree
    name: Drachenbaum Büro
    species: Dracaena marginata
    room: house.eg.office
    location: Büro
    watering_interval_days: 14
    enabled: true

