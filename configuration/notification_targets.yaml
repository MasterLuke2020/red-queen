# Red Queen WP-4.7.13.2 reference configuration for the live test house.
# Install as /config/wnhf/house/registry/notification_targets.yaml.

notification_targets:
  - id: notification.target.lukas
    name: Lukas
    enabled: true
    provider: home_assistant_notify_entity
    entity_id: notify.motorola_edge_40_neo

announcement_targets:
  - id: announcement.target.office
    name: Office announcement
    enabled: true
    provider: home_assistant_tts_sonos
    tts_entity_id: tts.google_translate_de_at
    cache: false
    with_group: true
    duration:
      seconds_per_word: 0.45
      padding_seconds: 3
      minimum_seconds: 5
      maximum_seconds: 90
    levels:
      info:
        speakers: [media_player.office]
        volume: 0.35
        prefix: null
      notice:
        speakers: [media_player.office]
        volume: 0.35
        prefix: Hinweis.
      warning:
        speakers: [media_player.office]
        volume: 0.45
        prefix: Warnung.
      alarm:
        speakers: [media_player.office]
        volume: 0.55
        prefix: Achtung!

  - id: announcement.target.house
    name: Whole-house announcement
    enabled: true
    provider: home_assistant_tts_sonos
    tts_entity_id: tts.google_translate_de_at
    cache: false
    with_group: true
    duration:
      seconds_per_word: 0.45
      padding_seconds: 3
      minimum_seconds: 5
      maximum_seconds: 90
    levels:
      info:
        speakers:
          - media_player.bathroom
          - media_player.dining_room
          - media_player.hobbyroom
          - media_player.living_room
          - media_player.office
        volume: 0.35
        prefix: null
      notice:
        speakers:
          - media_player.bathroom
          - media_player.dining_room
          - media_player.hobbyroom
          - media_player.living_room
          - media_player.office
        volume: 0.35
        prefix: Hinweis.
      warning:
        speakers:
          - media_player.bathroom
          - media_player.dining_room
          - media_player.hobbyroom
          - media_player.living_room
          - media_player.office
        volume: 0.45
        prefix: Warnung.
      alarm:
        speakers:
          - media_player.bathroom
          - media_player.dining_room
          - media_player.hobbyroom
          - media_player.living_room
          - media_player.office
        volume: 0.55
        prefix: Achtung!

notification_routes:
  - id: notification.route.house
    name: House notification route
    enabled: true
    notification_target_ids:
      - notification.target.lukas
    announcement_target_id: announcement.target.house
    log_enabled: true
    dashboard_enabled: true
    context:
      quiet_mode_entity_id: binary_sensor.wnhf_quiet_mode_active
      house_state_entity_id: sensor.wnhf_house_state
      voice_blocked_states:
        - away
        - vacation
        - unknown
        - unavailable
