contract:
  id: wnhf.generic_real_execution
  api_version: '1.0'
  execution_contract: 2.3-rc11
canonical_service: wnhf.execution_execute
enabled_actions:
- lighting.turn_on
- lighting.turn_off
- covers.open
- covers.close
- covers.blades_open
- covers.blades_close
- garage.open
- garage.close
- garage.stop
- openings.lock
- openings.unlock
- openings.release
- notifications.send
- notifications.announce
- notifications.route
- plants.record_watering
target_mode: single_object
validation_before_dispatch: true
provider_preflight_before_dispatch: true
real_execution_enabled: true
all_other_actions_blocked: true
result_codes:
- EXE-000
- EXE-101
- EXE-102
- EXE-205
- EXE-206
- EXE-207
- EXE-208
- EXE-300
- EXE-301
- EXE-900
notification_semantics:
  explicit_confirmation_required: false
  required_parameter_keys:
  - message
  optional_parameter_keys:
  - title
  idempotent: false
  verification_scope: dispatch
  framework_verified_on_success: true
  hardware_verified_on_success: false
  delivery_receipt_claimed: false
  read_receipt_claimed: false
  persistent_message_or_title: false
announcement_semantics:
  levels:
  - info
  - notice
  - warning
  - alarm
  explicit_confirmation_required: false
  native_tts_dispatch: true
  semantic_target_only: true
  raw_media_player_parameters_allowed: false
  sonos_native_announce_supported: true
  framework_snapshot_restore_used: false
  playback_heard_claimed: false
routing_semantics:
  priorities:
  - debug
  - info
  - warning
  - critical
  profiles:
  - standard
  - silent
  - voice
  - mobile
  - broadcast
  context_guarded_voice: true
  broadcast_overrides_voice_context_guard: true
  partial_channel_failure_is_failure: true
cover_directional_semantics:
  open_success_confirmation: opening_or_fully_open
  close_success_confirmation: closing_or_fully_closed
  duplicate_direction_command_while_moving: false
  automatic_reversal_while_opposite_movement: false
  canonical_open_execution: true
  canonical_close_execution: true
  canonical_blade_execution: true
  blade_actions:
  - covers.blades_open
  - covers.blades_close
  blade_position_feedback_required: false
  blade_verification_scope: dispatch
  blade_hardware_state_claimed: false
  set_position_execution: false
garage_directional_semantics:
  explicit_confirmation_required: true
  technical_control: osc
  stable_end_position_required: true
  moving_state_dispatch_allowed: false
  intermediate_state_dispatch_allowed: false
  already_satisfied_sends_command: false
  movement_observation_required: true
  terminal_end_feedback_required: true
  canonical_stop_execution: true
  dedicated_stop_command_required: true
  stop_moving_state_required: true
  stop_verification_scope: dispatch
  stopped_position_claimed: false
  canonical_toggle_execution: false
door_lock_semantics:
  explicit_confirmation_required: true
  closed_door_required: true
  stable_lock_feedback_required: true
  feedback_confirmation_required: true
  already_satisfied_sends_command: false
door_opener_semantics:
  action: openings.release
  explicit_confirmation_required: true
  closed_door_required: true
  command_entity_availability_required: true
  idempotent: false
  verification_scope: dispatch
  door_release_claimed: false
  physical_opening_claimed: false
plant_care_semantics:
  action: plants.record_watering
  parameters_allowed: false
  persistent_history: true
  atomic_write: true
  verification_scope: state
  framework_verified_on_success: true
  hardware_verified_on_success: false
  physical_watering_claimed: false
  soil_moisture_claimed: false
