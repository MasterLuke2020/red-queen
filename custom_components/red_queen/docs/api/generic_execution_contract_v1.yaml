contract:
  id: wnhf.generic_execution
  version: '1.1'
  implementation: 2.2-rc11
dry_run_enabled: true
hardware_dispatch_in_dry_run: false
real_execution_enabled_actions:
  lighting.turn_on: &single_object_no_parameters
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys: []
    required_parameter_keys: []
  lighting.turn_off: *single_object_no_parameters
  covers.open: *single_object_no_parameters
  covers.close: *single_object_no_parameters
  covers.blades_open: *single_object_no_parameters
  covers.blades_close: *single_object_no_parameters
  garage.open: *single_object_no_parameters
  garage.close: *single_object_no_parameters
  garage.stop: *single_object_no_parameters
  openings.lock: *single_object_no_parameters
  openings.unlock: *single_object_no_parameters
  openings.release:
    <<: *single_object_no_parameters
    confirmation_required: true
  notifications.send:
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys:
    - message
    - title
    required_parameter_keys:
    - message
    confirmation_required: false
    idempotent: false
  notifications.announce:
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys:
    - message
    - level
    required_parameter_keys:
    - message
    confirmation_required: false
    idempotent: false
  notifications.route:
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys:
    - message
    - title
    - priority
    - profile
    - source
    - category
    required_parameter_keys:
    - message
    confirmation_required: false
    idempotent: false
  plants.record_watering: *single_object_no_parameters
result_codes:
- EXE-100
- EXE-200
- EXE-201
- EXE-202
- EXE-203
- EXE-204
