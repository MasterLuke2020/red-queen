contract:
  id: wnhf.generic_execution
  version: '1.1'
  implementation: 1.6-rc5
dry_run_enabled: true
hardware_dispatch_in_dry_run: false
real_execution_enabled_actions:
  lighting.turn_on: &single_object
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys: []
  lighting.turn_off: *single_object
  covers.open: *single_object
  covers.close: *single_object
  garage.open: *single_object
  garage.close: *single_object
  openings.lock: *single_object
  openings.unlock: *single_object
result_codes:
- EXE-100
- EXE-200
- EXE-201
- EXE-202
- EXE-203
- EXE-204
