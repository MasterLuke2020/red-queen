contract:
  id: wnhf.generic_execution
  version: '1.1'
  implementation: 1.7-rc6
dry_run_enabled: true
hardware_dispatch_in_dry_run: false
real_execution_enabled_actions:
  lighting.turn_on: &single_object_no_parameters
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys: []
    required_parameter_keys: []
  lighting.turn_off: *single_object_no_parameters
  covers.open: *single_object_no_parameters
  covers.close: *single_object_no_parameters
  garage.open: *single_object_no_parameters
  garage.close: *single_object_no_parameters
  openings.lock: *single_object_no_parameters
  openings.unlock: *single_object_no_parameters
  notifications.send:
    target_mode: single_object
    required_target_keys:
    - object_id
    allowed_target_keys:
    - object_id
    allowed_parameter_keys:
    - message
    - title
    required_parameter_keys:
    - message
    confirmation_required: false
    idempotent: false
result_codes:
- EXE-100
- EXE-200
- EXE-201
- EXE-202
- EXE-203
- EXE-204
